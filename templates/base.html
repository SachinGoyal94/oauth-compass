<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OAuth Compass{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">◆</span> OAuth Compass</a>
    <nav class="topnav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Guides</a>
      <a href="/generate" class="{{ 'active' if request.url.path == '/generate' else '' }}">Generate for any app</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Evidence on every claim:
      <span class="ev ev-verified_from_docs">verified_from_docs</span>
      <span class="ev ev-reported">reported</span>
      <span class="ev ev-unknown">unknown</span>
    </span>
    <span>Research by agents via Composio · verified by humans · not affiliated with any provider</span>
  </footer>
  <script src="/static/app.js?v=3" defer></script>
</body>
</html>
